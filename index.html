<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

#login{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#000;
z-index:10;
}

.box{
background:rgba(0,0,0,.6);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
text-align:center;
color:#fff;
box-shadow:0 0 25px rgba(255,0,120,.4);
}

h2{
margin-bottom:20px;
}

input{
width:240px;
padding:12px;
border:none;
outline:none;
border-radius:10px;
text-align:center;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#ff4f9a;
color:#fff;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#page{
display:none;
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),
url("file_00000000cfa481f48cb2a6707b9b5792.png")
center center/cover no-repeat;
animation:fade 1.5s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.message{
position:absolute;
top:40px;
width:100%;
text-align:center;
color:#fff;
font-size:42px;
font-weight:bold;
text-shadow:0 0 15px #ff3d8b;
}

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-50px;
color:#ff4f9a;
font-size:25px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(0) scale(.8);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}
}.heart:nth-child(1){left:5%;animation-delay:0s;}
.heart:nth-child(2){left:15%;animation-delay:1s;}
.heart:nth-child(3){left:25%;animation-delay:2s;}
.heart:nth-child(4){left:35%;animation-delay:3s;}
.heart:nth-child(5){left:45%;animation-delay:4s;}
.heart:nth-child(6){left:55%;animation-delay:5s;}
.heart:nth-child(7){left:65%;animation-delay:1.5s;}
.heart:nth-child(8){left:75%;animation-delay:2.5s;}
.heart:nth-child(9){left:85%;animation-delay:3.5s;}
.heart:nth-child(10){left:95%;animation-delay:4.5s;}

</style>
</head>

<body>

<div id="login">
<div class="box">
<h2>🔒 اكتب الباسورد</h2>

<input
type="password"
id="pass"
placeholder="Password">

<br><br>

<button onclick="openPage()">
دخول
</button>

</div>
</div>

<div id="page">

<div class="message">
Happy Birthday ❤️
</div>

<div class="hearts">
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
<div class="heart">❤️</div>
</div>

</div>

<script>

function openPage(){

let password=document.getElementById("pass").value;

if(password==="Happy Birthday Dega"){

document.getElementById("login").style.display="none";

document.getElementById("page").style.display="block";

}else{

alert("الباسورد غلط");

}

}

</script>

</body>
</html>
